<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Comidas" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>Registro de comidas</title>
    <script>
      try {
        const saved = localStorage.getItem("comida-tema");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        } else {
          const hora = Number(new Intl.DateTimeFormat("en-US", { timeZone: "America/Lima", hour: "numeric", hourCycle: "h23" }).formatToParts(new Date()).find((parte) => parte.type === "hour").value);
          document.documentElement.dataset.theme = hora >= 7 && hora < 19 ? "light" : "dark";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <dialog class="login" id="login">
      <form id="clave-panel" novalidate>
        <label class="campo">
          Usuario
          <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
        </label>
        <label class="campo">
          Clave
          <span class="clave-fila">
            <input id="clave" name="clave" type="text" class="oculta" inputmode="numeric" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" />
            <button type="button" id="ver-clave" aria-label="Mostrar clave" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z"
                />
              </svg>
            </button>
          </span>
        </label>
        <p class="login-error" id="login-error" hidden></p>
        <button type="submit" class="entrar">Entrar</button>
      </form>
    </dialog>

    <dialog class="confirm-box" id="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="confirm-cancel">Cancelar</button>
        <button type="button" class="confirm-ok" id="confirm-ok">Continuar</button>
      </div>
    </dialog>

    <dialog class="share-box" id="share-box">
      <img id="share-image" alt="Detalle de comidas" />
      <p class="share-hint">Mantén presionado para enviar por WhatsApp</p>
      <button type="button" class="share-close" id="share-close">Cerrar</button>
    </dialog>

    <p class="aviso" id="aviso" hidden></p>
    <header>
        <div class="header-copy">
          <p class="eyebrow">Salitral</p>
          <h1>Registro de comidas</h1>
        </div>
        <div class="header-actions">
          <div class="user-chip" id="user-chip" hidden role="button" tabindex="0" aria-expanded="false" aria-label="Cuenta">
            <span class="user-avatar" id="user-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M5.6 18.4c.7-3.2 3-4.9 6.4-4.9s5.7 1.7 6.4 4.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </span>
            <span class="user-name" id="user-name"></span>
          </div>
          <div class="user-menu" id="user-menu" inert>
            <div class="user-menu-inner">
              <button class="user-menu-item" id="config-open" type="button" aria-label="Configuración">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.49.49 0 0 0-.61-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.61.22L2.73 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.07.63-.07.94s.03.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.29.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
                  />
                </svg>
              </button>
              <button class="user-menu-item" id="salir" type="button">Salir</button>
            </div>
          </div>
        </div>
    </header>

    <main class="app" id="app" inert>
      <section class="today-card glass" aria-labelledby="today-title">
        <div class="date-picker" id="date-picker">
          <div class="section-heading">
            <button type="button" class="date-title" id="date-trigger" aria-expanded="false" aria-controls="calendar">
              <h2 id="today-title" data-selected-date>—</h2>
            </button>
            <div class="today-actions">
              <button class="chip guests-chip" id="guests-toggle" type="button" hidden aria-pressed="false" aria-label="Invitados">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <circle cx="9" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="M4.6 17.4c.5-2.8 2.4-4.2 4.4-4.2s3.9 1.4 4.4 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                  <circle cx="16.4" cy="8.6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="M15.2 13.4c1.9.25 3.4 1.5 3.9 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                </svg>
              </button>
              <button class="text-button" id="go-today" type="button" hidden>Hoy</button>
            </div>
          </div>
          <input id="date" type="hidden" />
          <div class="calendar" id="calendar" hidden>
            <div class="cal-head">
              <button type="button" class="cal-nav" id="cal-prev" aria-label="Mes anterior">‹</button>
              <p id="cal-title"></p>
              <button type="button" class="cal-nav" id="cal-next" aria-label="Mes siguiente">›</button>
            </div>
            <div class="cal-week" aria-hidden="true">
              <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
        </div>

        <div class="meal-options" id="standard-meals">
          <div class="meal-row" id="breakfast-row" hidden>
            <div class="meal-button" id="breakfast">
              <span class="meal-icon meal-icon-breakfast" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <circle cx="12" cy="12" r="4.2" fill="currentColor" />
                  <path d="M12 3v2.2M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 7.2l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  <path d="M5 19.2h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span><strong>Desayuno</strong><small data-price="breakfast">S/ 11.00</small></span>
              <div class="meal-stepper">
                <button type="button" class="extra-minus" data-meal="breakfast" aria-label="Quitar desayuno">−</button>
                <span class="extra-count" data-meal="breakfast">0</span>
                <button type="button" class="extra-plus" data-meal="breakfast" aria-label="Sumar desayuno">+</button>
              </div>
            </div>
          </div>
          <div class="meal-row" id="lunch-row">
            <div class="meal-button" id="lunch" role="button" tabindex="0" aria-pressed="false">
              <span class="meal-icon meal-icon-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <circle cx="12" cy="12" r="4.2" fill="currentColor" />
                  <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span><strong>Almuerzo</strong><small data-price="lunch">S/ 11.00</small></span>
              <span class="check">✓</span>
              <div class="meal-stepper">
                <button type="button" class="extra-minus" data-meal="lunch" aria-label="Quitar almuerzo">−</button>
                <span class="extra-count" data-meal="lunch">0</span>
                <button type="button" class="extra-plus" data-meal="lunch" aria-label="Sumar almuerzo">+</button>
              </div>
            </div>
          </div>
          <div class="meal-row" id="dinner-row">
            <div class="meal-button" id="dinner" role="button" tabindex="0" aria-pressed="false">
              <span class="meal-icon meal-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <path d="M15.5 4.2A7.8 7.8 0 1 0 19.8 15 6.2 6.2 0 0 1 15.5 4.2z" fill="currentColor" />
                </svg>
              </span>
              <span><strong>Cena</strong><small data-price="dinner">S/ 11.00</small></span>
              <span class="check">✓</span>
              <div class="meal-stepper">
                <button type="button" class="extra-minus" data-meal="dinner" aria-label="Quitar cena">−</button>
                <span class="extra-count" data-meal="dinner">0</span>
                <button type="button" class="extra-plus" data-meal="dinner" aria-label="Sumar cena">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="portion-list" id="portion-list" hidden>
          <label class="portion-row">
            <span>
              <strong>Desayunos</strong>
              <small>S/ 11.00 c/u</small>
            </span>
            <input class="portion-input" data-meal="breakfast" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0" aria-label="Número de desayunos" />
          </label>
          <label class="portion-row">
            <span>
              <strong>Almuerzos</strong>
              <small>S/ 11.00 c/u</small>
            </span>
            <input class="portion-input" data-meal="lunch" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0" aria-label="Número de almuerzos" />
          </label>
          <label class="portion-row">
            <span>
              <strong>Cenas</strong>
              <small>S/ 11.00 c/u</small>
            </span>
            <input class="portion-input" data-meal="dinner" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0" aria-label="Número de cenas" />
          </label>
        </div>
        <p class="schedule-note" id="schedule-note" aria-live="polite"></p>
        <p class="save-message" id="save-message" aria-live="polite"></p>
      </section>

      <section class="summary-card glass" aria-label="Resumen del mes">
        <div class="summary-layout">
          <div class="totals">
            <div class="totals-count"><span id="meal-count">0</span><small>comidas</small></div>
            <div class="totals-amount"><span id="amount">S/ 0.00</span><small>por cancelar</small></div>
          </div>
          <div class="summary-actions">
            <label class="chip month-title">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <rect x="3.6" y="5.2" width="16.8" height="15.2" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M8 3.6v3.4M16 3.6v3.4M3.6 10.2h16.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <select id="month" class="month-select" aria-label="Mes"></select>
            </label>
            <button class="chip share-chip" id="share-summary" type="button" aria-label="Enviar">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 3.5v10.2M8.2 6.8 12 3.5l3.8 3.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M5.5 12.5v5.2A1.8 1.8 0 0 0 7.3 19.5h9.4a1.8 1.8 0 0 0 1.8-1.8v-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="history glass" aria-labelledby="history-title">
        <div class="section-heading">
          <div>
            <p class="label">Detalle</p>
            <h2 id="history-title">Registro</h2>
          </div>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </section>

    </main>

    <dialog class="config-box" id="config-box">
      <h2>Precios</h2>
      <p class="config-lead">S/ por ración</p>
      <div class="price-cards">
        <label class="price-card">
          <span>Desayuno</span>
          <span class="price-field">
            <span aria-hidden="true">S/</span>
            <input id="precio-desayuno" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" maxlength="5" />
          </span>
        </label>
        <label class="price-card">
          <span>Almuerzo</span>
          <span class="price-field">
            <span aria-hidden="true">S/</span>
            <input id="precio-almuerzo" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" maxlength="5" />
          </span>
        </label>
        <label class="price-card">
          <span>Cena</span>
          <span class="price-field">
            <span aria-hidden="true">S/</span>
            <input id="precio-cena" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" maxlength="5" />
          </span>
        </label>
      </div>
      <div class="scope-cards">
        <label class="scope-card">
          <input type="radio" name="precio-alcance" value="forward" checked />
          <span>Desde hoy</span>
        </label>
        <label class="scope-card">
          <input type="radio" name="precio-alcance" value="history" />
          <span>Histórico</span>
        </label>
      </div>
      <p class="config-lead">Apariencia</p>
      <div class="scope-cards theme-cards">
        <label class="scope-card">
          <input type="radio" name="tema" value="auto" checked />
          <span>Auto</span>
        </label>
        <label class="scope-card">
          <input type="radio" name="tema" value="light" />
          <span>Claro</span>
        </label>
        <label class="scope-card">
          <input type="radio" name="tema" value="dark" />
          <span>Oscuro</span>
        </label>
      </div>
      <p class="config-error" id="config-error" hidden></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="config-cancel" autofocus>Cerrar</button>
        <button type="button" class="confirm-ok" id="config-save">Guardar</button>
      </div>
    </dialog>

    <dialog class="confirm-box" id="clave-box">
      <p>Escribe tu clave para aplicar los precios.</p>
      <label class="campo">
        Clave
        <input id="clave-confirm" type="password" inputmode="numeric" autocomplete="off" />
      </label>
      <p class="login-error" id="clave-error" hidden></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="clave-cancel">Cancelar</button>
        <button type="button" class="confirm-ok" id="clave-ok">Confirmar</button>
      </div>
    </dialog>
    <div class="login-frost" aria-hidden="true"></div>
    <script src="auth.js"></script>
    <script src="acceso.js"></script>
    <script src="app.js"></script>
  </body>
</html>
